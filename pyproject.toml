[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finbot"
version = "0.1.0"
description = "Local-first cryptocurrency and asset trading bot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ccxt==4.5.84",
]

[tool.setuptools.packages.find]
where = ["src"]
